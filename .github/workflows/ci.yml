# Early CI draft (full NFR-CI-001 work is Week 4). NOT YET RUN.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      # The integration tests use this server instead of starting their own container.
      CELD_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Celd.Tests --locked-mode
      - run: dotnet build tests/Celd.Tests --no-restore --configuration Release
      - run: >
          dotnet test tests/Celd.Tests --no-build --configuration Release
          --logger "trx;LogFileName=results-${{ github.sha }}.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results

  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
